(function(){const KEY='sangga-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){data={}};data.customers=Array.isArray(data.customers)?data.customers:[];let editing=null;const $=id=>document.getElementById(id);const today=()=>new Date().toISOString().slice(0,10);function persist(){localStorage.setItem(KEY,JSON.stringify(data));}function reset(){editing=null;['name','purpose','area','budget','memo','note'].forEach(id=>$(id).value='');$('status').value='상담중';$('editor').style.display='none';}function open(c){editing=c?.id||null;$('name').value=c?.name||'';$('purpose').value=c?.purpose||'';$('area').value=c?.area||'';$('budget').value=c?.budget??'';$('status').value=c?.status||'상담중';$('memo').value=c?.memo||'';$('note').value=c?.note||'';$('editor').style.display='grid';$('name').focus();}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=data.customers.filter(c=>(!q||[c.name,c.purpose,c.area,c.memo,c.note].join(' ').toLowerCase().includes(q))&&(!f||c.status===f));$('rows').innerHTML=list.length?list.map(c=>`<tr><td><b>${c.name||''}</b></td><td>${c.purpose||''}</td><td>${c.area||''}</td><td>${c.budget??''}</td><td><span class="badge">${c.status||''}</span></td><td>${c.memo||c.note||''}</td><td>${c.updated||''}</td><td class="actions"><button data-edit="${c.id}">수정</button><button data-del="${c.id}">삭제</button></td></tr>`).join(''):'<tr><td colspan="8" class="empty">등록된 고객이 없습니다.</td></tr>';$('rows').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(data.customers.find(c=>c.id===b.dataset.edit)));$('rows').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('고객 정보를 삭제할까요?')){data.customers=data.customers.filter(c=>c.id!==b.dataset.del);persist();render();}})}$('add').onclick=()=>open();$('cancel').onclick=reset;$('save').onclick=()=>{const c={id:editing||'c'+Date.now(),name:$('name').value.trim(),purpose:$('purpose').value.trim(),area:$('area').value.trim(),budget:Number($('budget').value)||0,status:$('status').value,memo:$('memo').value.trim(),note:$('note').value.trim(),updated:today()};if(!c.name){alert('고객명을 입력하세요.');return}const i=data.customers.findIndex(x=>x.id===c.id);if(i>=0)data.customers[i]=c;else data.customers.unshift(c);persist();reset();render()};['search','filter'].forEach(id=>$(id).addEventListener('input',render));render()})();
</script>

  const style=document.createElement('style');style.textContent=`#customer-dialog{width:min(700px,94vw);max-height:90vh;padding:0;border:1px solid #dce5ef;border-radius:12px;color:#20304b}#customer-dialog::backdrop{background:#10234199}.customer-modal-form{padding:26px}.customer-modal-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #e5ebf2;padding-bottom:16px;margin-bottom:18px}.customer-modal-head h2{margin:5px 0 0;color:#173b68;font-size:21px}.modal-x{border:0;background:transparent;font-size:24px;padding:0 4px;color:#7f8da3}.customer-modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.customer-modal-grid label{display:grid;gap:6px;color:#6b7a92;font-size:11px}.customer-modal-grid input,.customer-modal-grid select,.customer-log-entry select,.customer-log-entry textarea{width:100%;border:1px solid #d5dfeb;border-radius:6px;padding:10px;color:#283954;background:#fff}.customer-log-box{border:1px solid #dce5ef;border-radius:8px;margin-top:20px;padding:14px;background:#f8fafc}.customer-log-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.customer-log-head h3{margin:0;color:#214a87;font-size:14px}.customer-log-head span{font-size:10px;color:#8c9bb0}.customer-log-entry{display:grid;grid-template-columns:100px 1fr 86px;gap:8px;align-items:stretch}.customer-log-entry textarea{min-height:66px;resize:vertical}.customer-log-entry button{border:0;border-radius:6px;background:#173b68;color:#fff;font-weight:600}.customer-log-entry button:hover{background:#173b68}.customer-log-history{max-height:180px;overflow:auto;margin-top:12px;display:grid;gap:8px}.customer-log-item{background:#fff;border:1px solid #e1e8f0;border-radius:6px;padding:9px 10px}.customer-log-item header{height:auto;padding:0;background:none;border:0;display:flex;justify-content:space-between;font-size:10px;color:#7f8da3}.customer-log-item p{margin:6px 0 0;font-size:11px;color:#354862;white-space:pre-wr   function renderLogs(customer){const logs=Array.isArray(customer?.logs)?customer.logs:pendingLogs,totalPages=Math.max(1,Math.ceil(logs.length/logPageSize));logPage=Math.min(Math.max(1,logPage),totalPages);const target=form.querySelector('[data-log-history]');form.querySelector('[data-log-count]').textContent=`${logs.length}건`;const start=(logPage-1)*logPageSize;const pageLogs=logs.slice(start,start+logPageSize);target.innerHTML=pageLogs.length?pageLogs.map(log=>`<article class="customer-log-item"><header><span>${esc(log.type||'상담')}</span><time>${esc(log.createdAt||'')}</time></header><p>${esc(log.text||'')}</p></article>`).join(''):'<p class="empty">기록된 상담일지가 없습니다.</p>';form.querySelector('[data-log-page]').textContent=`${logPage} / ${totalPages}`;form.querySelector('[data-log-prev]').disabled=logPage<=1;form.querySelector('[data-log-next]').disabled=logPage>=totalPages;}
  function openCustomer(customer){editingId=customer?.id||null;field('marketType').value=customer?.marketType==='sale'?'sale':'rent';field('name').value=customer?.name||'';field('category').value=customer?.category||customer?.purpose||'기타';field('phone').value=customer?.phone||'';field('budget').value=customer?.budget??'';field('status').value=customer?.status==='종료'?'종료':(customer?.status||'상담중');field('logText').value='';renderLogs(customer||{logs:[]});customerDialog.showModal();field('name').focus();}
  function renderCustomerRows(){const state=source();const customers=Array.isArray(state.customers)?state.customers:[];const q=($('search')?.value||'').trim().toLowerCase(),filter=$('filter')?.value||'';const list=customers.filter(c=>(!q||[c.name,c.category,c.purpose,c.phone,c.budget,c.memo,c.note].join(' ').toLowerCase().includes(q))&&(!filter||c.status===filter));const rows=$('rows');rows.innerHTML=list.length?list.map(c=>`<tr data-customer-id="${esc(c.id)}"><td><span class="badge">${esc(c.status||'상담중')}</span></td><td>${esc(c.category||c.purpose||'기타')}</td><td>${esc(c.marketType==='sale'?'매매':'임대')}</td><td><b>${esc(c.name||'')}</b></td><td>${esc(c.phone||'')}</td><td>${esc(c.budget??'')}</td><td>${esc(c.updated||'')}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">등록된 고객이 없습니다.</td></tr>';rows.querySelectorAll('tr[data-customer-id]').forEach(row=>row.onclick=()=>openCustomer(customers.find(c=>c.id===row.dataset.customerId)));}

  function customerNotice(text,items=[]){let notice=document.getElementById('customer-delete-message');if(!notice){notice=document.createElement('div');notice.id='customer-delete-message';notice.className='customer-delete-message';document.querySelector('.panel')?.append(notice);}notice.replaceChildren(document.createTextNode(text+' '));if(items.length){const undo=document.createElement('button');undo.type='button';undo.textContent='되돌리기';undo.onclick=()=>{const state=source(),trash=customerTrash(),ids=new Set(items.map(item=>item.id)),restored=trash.filter(item=>ids.has(item.id));const customers=Array.isArray(state.customers)?state.customers.slice():[];restored.sort((a,b)=>(a.deletedIndex??999999)-(b.deletedIndex??999999)).forEach(item=>{const copy={...item};delete copy.deletedAt;delete copy.deletedIndex;customers.splice(Math.min(item.deletedIndex??customers.length,customers.length),0,copy);});saveSource({...state,customers,trashCustomers:trash.filter(item=>!ids.has(item.id))});customerSelection.clear();notice.textContent=`${restored.length}건을 복구했습니다.`;renderCustomerRows();};notice.append(undo);}}
  function customerTrashDialog(){const items=customerTrash();let dialog=document.getElementById('customer-trash-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='customer-trash-dialog';dialog.innerHTML='<form method="dialog" class="bulk-trash-form"><div class="bulk-trash-head"><h3>휴지통</h3><button type="submit">닫기</button></div><div class="bulk-trash-list"></div></form>';document.body.append(dialog);}const list=dialog.querySelector('.bulk-trash-list');list.innerHTML=items.length?items.map(item=>`<article><div><b>${esc(item.name||'고객')}</b><small>고객 · 삭제일 ${esc(item.deletedAt||'')}</small></div><div><button type="button" data-restore-customer="${esc(item.id)}">복구</button><button type="button" data-delete-customer-forever="${esc(item.id)}">영구 삭제</button></div></article>`).join(''):'<p>휴지통이 비어 있습니다.</p>';list.querySelectorAll('[data-restore-customer]').forEach(button=>button.onclick=()=>{const state=source(),trash=customerTrash(),target=trash.find(item=>item.id===button.dataset.restoreCustomer);if(!target)return;const customers=Array.isArray(state.customers)?state.customers.slice():[],copy={...target};delete copy.deletedAt;delete copy.deletedIndex;customers.splice(Math.min(target.deletedIndex??customers.length,customers.length),0,copy);saveSource({...state,customers,trashCustomers:trash.filter(item=>item.id!==target.id)});dialog.close();renderCustomerRows();});list.querySelectorAll('[data-delete-customer-forever]').forEach(button=>button.onclick=()=>{if(!confirm('이 고객을 영구 삭제할까요? 복구할 수 없습니다.'))return;const state=source();saveSource({...state,trashCustomers:customerTrash().filter(item=>item.id!==button.dataset.deleteCustomerForever)});dialog.close();customerTrashDialog();});dialog.showModal();}
  function customerControls(){const table=document.querySelector('.panel .table'),head=table?.querySelector('thead tr'),body=$('rows'),tools=document.querySelector('.tools');if(!table||!head||!body||!tools)return;let bar=document.getElementById('customer-bulk-tools');if(!bar){bar=document.createElement('span');bar.id='customer-bulk-tools';bar.className='customer-bulk-tools';bar.innerHTML='<span>선택 0건</span><button type="button" data-customer-bulk-delete>선택 삭제</button><button type="button" data-customer-trash>휴지통</button>';tools.append(bar);}if(!head.querySelector('.customer-select-head')){const th=document.createElement('th');th.className='customer-select-head';th.innerHTML='<input type="checkbox" aria-label="현재 고객 목록 전체 선택">';head.prepend(th);}const headBox=head.querySelector('.customer-select-head input');const rows=[...body.querySelectorAll('tr[data-customer-id]')];rows.forEach(row=>{if(row.querySelector('.customer-select-cell'))return;const id=row.dataset.customerId;if(!id)return;const td=document.createElement('td');td.className='customer-select-cell';const box=document.createElement('input');box.type='checkbox';box.checked=customerSelection.has(id);box.onclick=event=>event.stopPropagation();box.onchange=()=>{if(box.checked)customerSelection.add(id);else customerSelection.delete(id);customerControls();};td.append(box);row.prepend(td);});const boxes=[...body.querySelectorAll('.customer-select-cell input')];headBox.checked=boxes.length>0&&boxes.every(box=>box.checked);headBox.indeterminate=boxes.some(box=>box.checked)&&!headBox.checked;headBox.onchange=()=>{boxes.forEach(box=>{box.checked=headBox.checked;const id=box.closest('tr').dataset.customerId;if(headBox.checked)customerSelection.add(id);else customerSelection.delete(id);});customerControls();};bar.firstElementChild.textContent=`선택 ${customerSelection.size}건`;bar.querySelector('[data-customer-bulk-delete]').onclick=()=>{const ids=[...customerSelection];if(!ids.length){alert('삭제할 고객을 선택하세요.');return}if(!confirm(`선택한 항목 ${ids.length}건을 삭제하시겠습니까?`))return;const state=source(),customers=Array.isArray(state.customers)?state.customers:[],trash=customerTrash(),removed=[];const remaining=customers.filter((item,index)=>{if(!ids.includes(item.id))return true;removed.push({...item,deletedAt:new Date().toISOString().slice(0,16).replace('T',' '),deletedIndex:index});return false;});saveSource({...state,customers:remaining,trashCustomers:[...trash,...removed]});customerSelection.clear();customerNotice(`${removed.length}건이 삭제되었습니다.`,removed);renderCustomerRows();};bar.querySelector('[data-customer-trash]').onclick=customerTrashDialog;}
  const customerRenderBase=renderCustomerRows;renderCustomerRows=()=>{customerRenderBase();customerControls();};
  $('rows').addEventListener('click',event=>{const button=event.target.closest('[data-del-v2]');if(!button)return;event.preventDefault();event.stopImmediatePropagation();const id=button.dataset.delV2;if(!confirm('이 고객을 삭제하시겠습니까?'))return;const state=source(),customers=Array.isArray(state.customers)?state.customers:[],index=customers.findIndex(item=>item.id===id);if(index<0)return;const removed={...customers[index],deletedAt:new Date().toISOString().slice(0,16).replace('T',' '),deletedIndex:index};customers.splice(index,1);saveSource({...state,customers,trashCustomers:[...customerTrash(),removed]});customerSelection.delete(id);customerNotice('1건이 삭제되었습니다.',[removed]);renderCustomerRows();},true);
  renderCustomerRows();
})();
</script>
